schema: spec-driven
context: |
  42P authority: SPEC.md -> Capture -> Allocation -> OpenSpec realization canon
  -> Proposition -> implementation -> Verification.
  SPEC.md remains the authoritative product contract.
  Capture owns rationale and Allocation owns allocation toward realization,
  both subordinate to SPEC.md. Current Capture and Allocation live in
  .42p/engineering/ relative to the repository root (parent of this project root).
  Every Change MUST derive from Allocation and MUST NOT add unallocated product
  requirements. Insufficiency, contradiction or required upstream semantic change
  MUST cause escalation; never reinterpret upstream authority locally.
  Before sync, Allocation -> OpenSpec and OpenSpec -> Allocation coverage MUST both
  be 100%. openspec/specs/ is the cumulative synchronized realization canon derived
  from Allocation, not a second product specification or implementation evidence.
  Apply MUST respect the Change, synchronized canon and repository standards.
  42P Verification MUST precede archive; archive cannot replace Verification.
  Read ../AGENTS.md and standards/openspec.md. Normal CLI commands MUST run from
  this .42p project root. Use local OpenSpec only; no Store or --store.
