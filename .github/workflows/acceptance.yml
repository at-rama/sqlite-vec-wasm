name: Acceptance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      revision:
        description: Exact commit or ref to evaluate
        required: true
      package_name:
        description: Already selected package identity (no publication)
        default: sqlite-vec-wasm-acceptance-fixture
      package_version:
        description: Already selected version (no publication)
        default: 0.0.0-test

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.revision || github.sha }}
      - name: Install documented system prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 curl ca-certificates unzip xz-utils nodejs \
            libglib2.0-0t64 libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 \
            libdbus-1-3 libx11-6 libxcomposite1 libxdamage1 libxext6 libxfixes3 \
            libxrandr2 libgbm1 libdrm2 libasound2t64
      - name: Produce and accept exact final package
        env:
          PACKAGE_NAME: ${{ inputs.package_name || 'sqlite-vec-wasm-acceptance-fixture' }}
          PACKAGE_VERSION: ${{ inputs.package_version || '0.0.0-test' }}
        run: bash tools/acceptance.sh --name "$PACKAGE_NAME" --version "$PACKAGE_VERSION"
      - name: Preserve available acceptance evidence and exact payload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: .work/acceptance/run-*/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
